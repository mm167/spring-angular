<main>
  <h1>{{ title() }}</h1>

  <nav>
    <a routerLink="/materiels">Matériels</a>
    |
    <a routerLink="/reservations">Réservations</a>
    |
    <a routerLink="/connexion">Connexion</a>
  </nav>

  @if (session.connecte()) {
    <p>
      Connecté : {{ session.identifiant() }} ({{ session.roles().join(', ') }})
      <button type="button" (click)="deconnecter()">Se déconnecter</button>
    </p>
  } @else {
    <p>Non connecté</p>
  }

  <router-outlet />
</main>
