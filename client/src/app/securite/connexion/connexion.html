<h2>Connexion</h2>

@if (session.connecte()) {
  <p>Vous êtes connecté.</p>
} @else {
  <form novalidate (submit)="seConnecter($event)">
    <label>Identifiant <input type="text" [formField]="formulaire.identifiant" /></label>
    <label>Mot de passe <input type="password" [formField]="formulaire.motDePasse" /></label>
    <button type="submit">Se connecter</button>
  </form>
}

<p>{{ message() }}</p>
