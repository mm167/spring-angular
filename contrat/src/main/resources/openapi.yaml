openapi: 3.0.3
info:
  title: API de location de matériel
  description: Contrat de l'API du fil rouge (matériels, réservations et authentification).
  version: 1.3.0
servers:
  - url: http://localhost:8080
    description: Poste local
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [authentification]
      operationId: seConnecter
      summary: Obtenir un jeton d'accès
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identifiants'
      responses:
        '200':
          description: Jeton d'accès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jeton'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /api/auth/rafraichir:
    post:
      tags: [ authentification ]
      operationId: rafraichir
      summary: Obtenir une nouvelle paire de jetons
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeRafraichissement'
      responses:
        '200':
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jeton'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
  /api/auth/inscription:
    post:
      tags: [authentification]
      operationId: inscrire
      summary: Créer un compte client
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inscription'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteCree'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '409':
          $ref: '#/components/responses/IdentifiantPris'
  /api/materiels:
    get:
      tags: [materiels]
      operationId: listerMateriels
      summary: Lister les matériels
      security: []
      responses:
        '200':
          description: Liste des matériels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Materiel'
    post:
      tags: [materiels]
      operationId: creerMateriel
      summary: Créer un matériel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouveauMateriel'
      responses:
        '201':
          description: Matériel créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materiel'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
  /api/materiels/{id}:
    get:
      tags: [materiels]
      operationId: consulterMateriel
      summary: Consulter un matériel
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Le matériel demandé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Materiel'
        '404':
          $ref: '#/components/responses/NonTrouve'
  /api/reservations:
    get:
      tags: [reservations]
      operationId: listerReservations
      summary: Lister les réservations
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
    post:
      tags: [reservations]
      operationId: creerReservation
      summary: Créer une réservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NouvelleReservation'
      responses:
        '201':
          description: Réservation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/RequeteInvalide'
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '404':
          $ref: '#/components/responses/NonTrouve'
        '409':
          $ref: '#/components/responses/Conflit'
  /api/reservations/{id}:
    delete:
      tags: [reservations]
      operationId: annulerReservation
      summary: Annuler une réservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Réservation annulée
        '401':
          $ref: '#/components/responses/NonAuthentifie'
        '403':
          $ref: '#/components/responses/Interdit'
        '404':
          $ref: '#/components/responses/NonTrouve'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Categorie:
      type: string
      enum: [MINI_PELLE, NACELLE, COMPACTEUR]
    Materiel:
      type: object
      required: [id, nom, categorie, tarifJournalier]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nom:
          type: string
          example: Mini-pelle 1,5 t
        categorie:
          $ref: '#/components/schemas/Categorie'
        tarifJournalier:
          type: number
          format: double
          example: 180.0
    NouveauMateriel:
      type: object
      required: [nom, categorie, tarifJournalier]
      properties:
        nom:
          type: string
          minLength: 1
          example: Mini-pelle 1,5 t
        categorie:
          $ref: '#/components/schemas/Categorie'
        tarifJournalier:
          type: number
          format: double
          minimum: 0
          example: 180.0
    Reservation:
      type: object
      required: [id, materielId, client, dateDebut, dateFin]
      properties:
        id:
          type: integer
          format: int64
          example: 10
        materielId:
          type: integer
          format: int64
          example: 1
        client:
          type: string
          example: Entreprise Durand
        dateDebut:
          type: string
          format: date
          example: 2026-12-01
        dateFin:
          type: string
          format: date
          example: 2026-12-05
    NouvelleReservation:
      type: object
      required: [materielId, client, dateDebut, dateFin]
      properties:
        materielId:
          type: integer
          format: int64
          example: 1
        client:
          type: string
          minLength: 1
          example: Entreprise Durand
        dateDebut:
          type: string
          format: date
          example: 2026-12-01
        dateFin:
          type: string
          format: date
          example: 2026-12-05
    Identifiants:
      type: object
      required: [identifiant, motDePasse]
      properties:
        identifiant:
          type: string
          minLength: 1
          example: durand
        motDePasse:
          type: string
          minLength: 1
          example: durand123
    Jeton:
      type: object
      required: [ jetonAcces, jetonRafraichissement, expireDans, roles ]
      properties:
        jetonAcces:
          type: string
          description: Jeton JWT à placer dans l'en-tête Authorization (schéma Bearer).
        jetonRafraichissement:
          type: string
          description: Jeton opaque à envoyer à /api/auth/rafraichir. Il ne sert qu'une fois.
        expireDans:
          type: integer
          description: Durée de validité du jeton d'accès, en secondes.
          example: 900
        roles:
          type: array
          items:
            type: string
          example: [ CLIENT ]
    DemandeRafraichissement:
      type: object
      required: [ jetonRafraichissement ]
      properties:
        jetonRafraichissement:
          type: string
          minLength: 1
    Inscription:
      type: object
      required: [identifiant, motDePasse]
      properties:
        identifiant:
          type: string
          minLength: 3
          maxLength: 50
          example: martin
        motDePasse:
          type: string
          minLength: 8
          maxLength: 72
          example: motdepasse1
    CompteCree:
      type: object
      required: [identifiant, role]
      properties:
        identifiant:
          type: string
          example: martin
        role:
          type: string
          example: CLIENT
    Erreur:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          example: 409
        message:
          type: string
          example: Le matériel est déjà réservé sur cette période.
  responses:
    RequeteInvalide:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    NonAuthentifie:
      description: Authentification absente, invalide ou expirée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Interdit:
      description: Droits insuffisants pour cette opération
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    NonTrouve:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    IdentifiantPris:
      description: Identifiant déjà utilisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
    Conflit:
      description: Période déjà réservée pour ce matériel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'