spring:
  application:
    name: location-api
  jackson:
    serialization:
      indent-output: true
  datasource:
    url: jdbc:mysql://localhost:3306/location
    username: location
    password: location
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /documentation

location:
  securite:
    secret: secret-de-demonstration-du-cours-location-2026
    duree-jeton: 15m
    duree-rafraichissement: 8h